<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="ports.css">
  <script src="../base1/cockpit.js"></script>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/>
        <rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4M5 16v-2h14v2"/>
      </svg>
    </div>
    <div>
      <h1>Ports</h1>
      <p>Every port on this server and what's using it. Read-only.</p>
    </div>
  </div>

  <div id="warnings"></div>

  <div class="cards">
    <div class="card">
      <div class="icon i-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div><div class="num" id="cListening">–</div><div class="label">In use</div><div class="hint">Listening right now</div></div>
    </div>
    <div class="card">
      <div class="icon i-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>
      <div><div class="num" id="cReserved">–</div><div class="label">Reserved</div><div class="hint">Mapped by stopped containers</div></div>
    </div>
    <div class="card">
      <div class="icon i-red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg></div>
      <div><div class="num" id="cConflict">–</div><div class="label">Conflicts</div><div class="hint">Reserved port taken by something else</div></div>
    </div>
    <div class="card">
      <div class="icon i-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3z"/></svg></div>
      <div><div class="num" id="cTotal">–</div><div class="label">Total ports</div><div class="hint">Tracked on this server</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input type="search" id="filter" placeholder="Search a port (1234), a range (1234-1500), or a name, user, service, container…">
      </div>
      <select id="proto">
        <option value="">TCP + UDP</option>
        <option value="tcp">TCP</option>
        <option value="udp">UDP</option>
      </select>
      <select id="status">
        <option value="">All statuses</option>
        <option value="listening">In use</option>
        <option value="reserved">Reserved</option>
        <option value="conflict">Conflict</option>
        <option value="free">Free</option>
      </select>
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="refresh" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
    <div class="rangebar hidden" id="rangebar"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="port">Port</th>
            <th data-sort="proto">Protocol</th>
            <th data-sort="status">Status</th>
            <th data-sort="owner">Used by</th>
            <th>Maps to</th>
            <th data-sort="user">User</th>
            <th data-sort="addrs">Bound to</th>
            <th>Process</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="pager">
      <label class="muted">Rows per page
        <select id="perPage">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="0">All</option>
        </select>
      </label>
      <span class="muted" id="pageInfo"></span>
      <div class="pager-btns">
        <button class="icon-btn" id="prevPage" title="Previous page">‹</button>
        <button class="icon-btn" id="nextPage" title="Next page">›</button>
      </div>
    </div>
  </div>

  <script src="ports.js"></script>
</body>
</html>
